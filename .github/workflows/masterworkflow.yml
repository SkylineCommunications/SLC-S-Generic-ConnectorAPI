name: DataMiner CICD Internal Nuget Solution
on:
  push:
    branches:
    - main
    - master
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-[0-9a-zA-Z]+'
  workflow_dispatch: 
jobs:
  CICD:
    name: CICD
    uses: SkylineCommunications/_ReusableWorkflows/.github/workflows/Master Workflow.yml@main
    with:
      sonarcloud-project-name: SkylineCommunications_SLC-S-Generic-ConnectorAPI
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGETAPIKEY_GITHUB  }}
